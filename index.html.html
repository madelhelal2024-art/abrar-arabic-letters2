<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>الحروف العربية — الأبرار</title>
  <style>
    :root { --navy:#103f68; --teal:#159eaf; --blue:#1faed4; --ivory:#f8fcff; --ink:#173c55; --gold:#f3c963; }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:#eaf5fb;color:var(--ink);font-family:Cairo,Tahoma,Arial,sans-serif;display:grid;place-items:center}
    .stage{position:relative;isolation:isolate;width:min(1320px,100%);min-height:min(742px,100vh);background:linear-gradient(130deg,#f8fdff,#edfaff);box-shadow:0 16px 50px #0c5e811f;overflow:hidden;padding:35px 50px 22px}
    .stage:before{content:"";position:absolute;inset:0;background-image:linear-gradient(35deg,transparent 48%,#24a7ce09 49%,#24a7ce09 51%,transparent 52%),linear-gradient(-35deg,transparent 48%,#24a7ce09 49%,#24a7ce09 51%,transparent 52%);background-size:92px 92px;z-index:-1}
    header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:26px}
    .brand{width:105px;height:105px;display:flex;justify-content:center;align-items:center;background:#fff;border-radius:20px;box-shadow:0 8px 28px #0e537014}
    .brand img{max-width:94px;max-height:94px;object-fit:contain}
    .titlebox{text-align:center;flex:1}
    h1{font-size:clamp(29px,3.2vw,45px);margin:0;color:var(--navy);font-weight:900}
    .subtitle{font-size:clamp(17px,1.5vw,21px);font-weight:700;color:#587d92;margin:6px 0 0}
    .ribbon{color:var(--teal);font-size:14px;font-weight:800;letter-spacing:.3px}
    .badge{background:#e7f5fb;color:var(--navy);padding:9px 14px;border-radius:40px;font-weight:800;white-space:nowrap}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:4px auto 21px}
    .btn{border:0;cursor:pointer;border-radius:14px;padding:14px 22px;font:800 17px Cairo,Tahoma,Arial,sans-serif;transition:transform .15s,box-shadow .15s}
    .btn:hover,.sound:hover{transform:translateY(-3px)}
    .btn:focus-visible,.sound:focus-visible{outline:4px solid var(--gold);outline-offset:4px}
    .btn.primary{background:var(--navy);color:#fff;box-shadow:0 7px 17px #103f6826}
    .btn.secondary{background:#e0f2f7;color:var(--navy)}
    .help{font-size:15px;color:#54768a;font-weight:700}
    .grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:19px}
    .card{position:relative;min-width:0;min-height:335px;border:2px solid #d5e7ed;background:#fff;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:20px 12px 23px;box-shadow:0 9px 23px #195c7212;transition:border-color .15s,transform .15s}
    .card.playing{border-color:var(--blue);transform:translateY(-5px);box-shadow:0 15px 27px #159eaf29}
    .letter{font-size:clamp(84px,9vw,133px);line-height:1.36;color:var(--navy);font-weight:900;min-height:171px;display:grid;place-items:center}
    .sound{display:grid;place-items:center;width:74px;height:74px;border:0;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--teal));color:white;font-size:32px;cursor:pointer;box-shadow:0 6px 16px #1097b43b;transition:transform .15s}
    .caption{font-size:16px;font-weight:800;color:var(--navy);margin:16px 0 0}
    .check{position:absolute;top:12px;left:12px;background:#dff7e9;color:#16804b;border-radius:50%;width:30px;height:30px;display:grid;place-items:center;font-weight:900;opacity:0;transition:opacity .15s}
    .card.done .check{opacity:1}
    .status{background:#fffefa;border:1px solid #e1edf0;border-radius:18px;padding:19px 23px;margin-top:24px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .progress{font-size:18px;color:var(--navy);font-weight:800}
    .stars{font-size:29px;letter-spacing:3px;color:#b8c8d3;direction:ltr;white-space:nowrap}
    .stars .lit{color:var(--gold)}
    .message{font-size:15px;color:#58788c;margin:3px 0}
    footer{font-size:14px;text-align:center;margin-top:18px;color:#68859b;font-weight:800;direction:ltr}
    @media(max-width:760px){.stage{padding:18px 14px;min-height:100vh}.brand{width:62px;height:62px}.brand img{max-width:56px;max-height:56px}.badge{display:none}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{min-height:250px;padding:12px 6px}.letter{min-height:120px;font-size:78px}.sound{width:57px;height:57px;font-size:25px}.toolbar{flex-wrap:wrap}.help{width:100%;text-align:center}.status{flex-wrap:wrap}.stars{font-size:22px}header{margin-bottom:10px}}
    @media(max-width:400px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card{min-height:230px}.subtitle{font-size:14px}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important}}
  </style>
</head>

    const glyph=document.createElement('div');glyph.className='letter';glyph.textContent=item.letter;
    const button=document.createElement('button');button.className='sound';button.type='button';button.textContent='🔊';button.setAttribute('aria-label','استمع إلى صوت '+item.name);
    button.addEventListener('click',()=>{sequence=false;play(index)});
    const caption=document.createElement('div');caption.className='caption';caption.textContent='استمع للصوت';
    card.append(check,glyph,button,caption); cards.appendChild(card);
  });
  function setMessage(text){document.getElementById('message').textContent=text}
  function updateProgress(){
    document.getElementById('progress').textContent='تعلّمتَ '+learned.size+' من ٥ حروف';
    document.querySelectorAll('.card').forEach((c,i)=>c.classList.toggle('done',learned.has(i)));
    document.getElementById('stars').innerHTML=data.map((_,i)=>'<span class="'+(i<learned.size?'lit':'')+'">★</span>').join('');
  }
  function clearPlaying(){document.querySelectorAll('.card').forEach(c=>c.classList.remove('playing'))}
  async function play(index){
    audio.pause();audio.currentTime=0;clearPlaying();
    playingIndex=index;audio.src=data[index].audio;
    document.querySelector('.card[data-index="'+index+'"]').classList.add('playing');
    setMessage('نستمع الآن إلى حرف '+data[index].letter);
    try{await audio.play()}catch(err){setMessage('تعذّر تشغيل الملف الصوتي في هذا المتصفح.');sequence=false;clearPlaying()}
  }
  audio.addEventListener('ended',()=>{
    if(playingIndex>=0)learned.add(playingIndex);
    const next=playingIndex+1;clearPlaying();updateProgress();
    if(sequence && next<data.length){play(next)}else{sequence=false;setMessage(learned.size===5?'رائع! أحسنتَ، أنهيتَ الحروف الخمسة.':'أحسنتَ! اختر الحرف التالي.')}
  });
  document.getElementById('playAll').addEventListener('click',()=>{sequence=true;play(0)});
  document.getElementById('stop').addEventListener('click',()=>{sequence=false;audio.pause();audio.currentTime=0;clearPlaying();setMessage('توقف الصوت. اضغط على أي حرف للاستماع.')});
  updateProgress();
</script>
</body>
</html>
